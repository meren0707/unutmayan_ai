<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>1M Context AI Assistant</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
                body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
                    header { background-color: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
                        header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
                            .btn-reset { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
                                .btn-reset:hover { background: #dc2626; }
                                    
                                        #chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
                                            .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
                                                .user { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
                                                    .assistant { align-self: flex-start; background-color: #1e293b; color: #f1f5f9; border-bottom-left-radius: 2px; border: 1px solid #334155; }
                                                        
                                                            #input-form { padding: 1rem; background-color: #1e293b; display: flex; gap: 0.75rem; border-top: 1px solid #334155; }
                                                                #message-input { flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; font-size: 1rem; }
                                                                    #message-input:focus { border-color: #38bdf8; }
                                                                        button[type="submit"] { background-color: #0284c7; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
                                                                            button[type="submit"]:hover { background-color: #0369a1; }
                                                                              </style>
                                                                              </head>
                                                                              <body>

                                                                                <header>
                                                                                    <h1>GLM 1M Memory AI</h1>
                                                                                        <button class="btn-reset" onclick="resetMemory()">Hafızayı Sıfırla</button>
                                                                                          </header>

                                                                                            <div id="chat-container"></div>

                                                                                              <form id="input-form">
                                                                                                  <input type="text" id="message-input" placeholder="Bir şeyler yazın... (Örn: Tüm bir kitabı veya uzun kodları yapıştırın)" autocomplete="off">
                                                                                                      <button type="submit">Gönder</button>
                                                                                                        </form>

                                                                                                          <script>
                                                                                                              const chatContainer = document.getElementById('chat-container');
                                                                                                                  const inputForm = document.getElementById('input-form');
                                                                                                                      const messageInput = document.getElementById('message-input');

                                                                                                                          function appendMessage(role, text) {
                                                                                                                                const msgDiv = document.createElement('div');
                                                                                                                                      msgDiv.classList.add('message', role);
                                                                                                                                            msgDiv.textContent = text;
                                                                                                                                                  chatContainer.appendChild(msgDiv);
                                                                                                                                                        chatContainer.scrollTop = chatContainer.scrollHeight;
                                                                                                                                                            }

                                                                                                                                                                inputForm.addEventListener('submit', async (e) => {
                                                                                                                                                                      e.preventDefault();
                                                                                                                                                                            const message = messageInput.value.trim();
                                                                                                                                                                                  if (!message) return;

                                                                                                                                                                                        appendMessage('user', message);
                                                                                                                                                                                              messageInput.value = '';

                                                                                                                                                                                                    try {
                                                                                                                                                                                                            const res = await fetch('/api/chat', {
                                                                                                                                                                                                                      method: 'POST',
                                                                                                                                                                                                                                headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                          body: JSON.stringify({ message })
                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                          const data = await res.json();

                                                                                                                                                                                                                                                                  if (data.reply) {
                                                                                                                                                                                                                                                                            appendMessage('assistant', data.reply);
                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                              appendMessage('assistant', 'Hata: ' + (data.error || 'Yanıt alınamadı.'));
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                            } catch (err) {
                                                                                                                                                                                                                                                                                                                    appendMessage('assistant', 'Sunucu bağlantı hatası oluştu.');
                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                  async function resetMemory() {
                                                                                                                                                                                                                                                                                                                                        if (confirm('Tüm sohbet geçmişi sıfırlanacak. Emin misiniz?')) {
                                                                                                                                                                                                                                                                                                                                                await fetch('/api/reset', { method: 'POST' });
                                                                                                                                                                                                                                                                                                                                                        chatContainer.innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                appendMessage('assistant', 'Hafıza sıfırlandı. Yeni bir konuşma başlatabilirsiniz.');
                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                            </html>
